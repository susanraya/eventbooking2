spring.application.name=api
# 0.0.0.0 inside a container; HOST=127.0.0.1 keeps a local run off the network.
server.address=${HOST:0.0.0.0}
server.port=${PORT:8000}
# Creates a table or column the entities add; never drops one. Replace with Flyway
# migrations before anything holds data worth keeping.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Quoted, so a table named after an SQL keyword (user, order) still works everywhere --
# names only, never a column's declared type.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
# A table that cannot be created stops the app, rather than a log line nobody reads: the
# baseline test then fails on a mapping the database refuses.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
